<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}Import Frazão — Perfumes Importados{% endblock %}</title>
    <meta name="description" content="Vitrine de perfumes importados Import Frazão." />
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    {% block extra %}{% endblock %}
  </head>
  <body>
    {% with avisos = get_flashed_messages(with_categories=true) %}
      {% if avisos %}
        <div class="avisos">
          {% for tipo, texto in avisos %}
            <p class="aviso {{ tipo }}">{{ texto }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block corpo %}{% endblock %}
  </body>
</html>
